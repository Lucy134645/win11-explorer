[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "win11-explorer"
version = "1.0.0"
description = "A 1:1 replica of Windows 11 File Explorer for Arch Linux built with PyQt6 and Fluent Design."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Apex" }
]
keywords = [
    "windows-11",
    "file-explorer",
    "file-manager",
    "arch-linux",
    "cachyos",
    "fluent-design",
    "mica",
    "pyqt6",
    "desktop-app"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities"
]
dependencies = [
    "PyQt6>=6.5.0",
    "send2trash>=1.8.0"
]

[project.scripts]
win11-explorer = "win11_explorer.main:main"

[project.urls]
Homepage = "https://github.com/apex/win11-explorer"
Repository = "https://github.com/apex/win11-explorer"
Issues = "https://github.com/apex/win11-explorer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["win11_explorer*"]

[tool.setuptools.package-data]
win11_explorer = ["resources/**/*"]
